<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="main-nav container flex">
            <a href="/" class="company-logo" aria-label="News App home">
                <img src="logo.png" alt="News App logo" width="120" height="50">
            </a>
            <div class="nav-links">
                <ul class="flex">
                    <li><button class="hover-link nav-item" type="button" data-query="ipl">IPL</button></li>
                    <li><button class="hover-link nav-item" type="button" data-query="finance">Finance</button></li>
                    <li><button class="hover-link nav-item" type="button" data-query="politics">Politics</button></li>
                </ul>
            </div>
            <div class="search-bar flex">
                <input id="search-text" type="search" class="news-input" placeholder="e.g. Science" autocomplete="off">
                <button id="search-button" class="search-button" type="button">Search</button>
            </div>
            <div class="nav-actions">
                <button id="lang-toggle" class="lang-button" type="button">हिन्दी</button>
                <button id="theme-toggle" class="search-button" type="button">Dark</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="status-message container" id="status-message" role="status" aria-live="polite"></div>
        <div class="cards-container container flex" id="cards-container">
        </div>
    </main>

    <template id="template-news-card">
        <div class="card">
            <div class="card-header">
                <img src="https://via.placeholder.com/400x200" alt="news-image" id="news-img">
            </div>
            <div class="card-content">
                <h3 id="news-title">This is the Title</h3>
                <h6 class="news-source" id="news-source">End Gadget 26/08/2023</h6>
                <p class="news-desc" id="news-desc">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Recusandae saepe quis voluptatum quisquam vitae doloremque facilis molestias quae ratione cumque!</p>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
